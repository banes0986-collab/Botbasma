<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CraftHosting | Stress & Load Test Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0a0a0c;
      --card-bg: #141419;
      --border-color: #2a1215;
      --primary-red: #ff1e43;
      --hover-red: #d60e2e;
      --glow-red: rgba(255, 30, 67, 0.35);
      --text-main: #f1f1f3;
      --text-muted: #8a8a93;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 2rem; }

    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); margin-bottom: 2rem;
    }
    .logo { font-size: 1.5rem; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
    .logo span { color: var(--primary-red); }
    .badge { background: rgba(255, 30, 67, 0.15); color: var(--primary-red); border: 1px solid var(--primary-red); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 1.5rem; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
    .card-title::before { content: ''; width: 8px; height: 16px; background: var(--primary-red); border-radius: 2px; }

    .stat-container { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .stat-box { background: #0c0c0f; border: 1px solid rgba(255,255,255,0.05); padding: 1.2rem; border-radius: 8px; text-align: center; }
    .stat-value { font-size: 2.2rem; font-weight: 800; color: var(--primary-red); font-family: 'JetBrains Mono', monospace; text-shadow: 0 0 12px var(--glow-red); }
    .stat-label { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; }

    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    input {
      width: 100%; background: #0c0c0f; border: 1px solid var(--border-color);
      padding: 12px; border-radius: 6px; color: #fff; font-size: 0.95rem; outline: none; transition: 0.2s;
    }
    input:focus { border-color: var(--primary-red); box-shadow: 0 0 8px var(--glow-red); }

    .btn-group { display: flex; gap: 10px; margin-top: 1.5rem; }
    button {
      flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: 700;
      cursor: pointer; transition: 0.2s; text-transform: uppercase; font-size: 0.9rem;
    }
    .btn-start { background: var(--primary-red); color: #fff; box-shadow: 0 0 15px var(--glow-red); }
    .btn-start:hover { background: var(--hover-red); }
    .btn-stop { background: #222; color: #fff; border: 1px solid #444; }
    .btn-stop:hover { background: #333; }

    .terminal {
      background: #060608; border: 1px solid var(--border-color); border-radius: 8px;
      padding: 1rem; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
      height: 200px; overflow-y: auto; color: #00ff66;
    }
    .terminal .log-line { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.02); padding-bottom: 2px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">CRAFT<span>HOSTING</span> TEST HUB</div>
    <div class="badge">PORT: 6000</div>
  </div>

  <div class="grid">
    <!-- Dashboard Stats -->
    <div class="card">
      <div class="card-title">DASHBOARD & İSTATİSTİKLER</div>
      <div class="stat-container">
        <div class="stat-box">
          <div class="stat-value" id="botCount">0</div>
          <div class="stat-label">Aktif Bot Sayısı</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="statusText" style="font-size: 1.2rem; line-height: 2.2rem;">HAZIR</div>
          <div class="stat-label">Test Durumu</div>
        </div>
      </div>
    </div>

    <!-- Attack / Stress Hub Controls -->
    <div class="card">
      <div class="card-title">STRESS & ATTACK HUB</div>
      <div class="form-group">
        <label>SUNUCU IP ADRESİ</label>
        <input type="text" id="host" placeholder="sunucu.craftmc.com.tr">
      </div>
      <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
          <label>PORT</label>
          <input type="number" id="port" value="25565">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>BOT SAYISI (HEDEF)</label>
          <input type="number" id="targetCount" value="10">
        </div>
      </div>
      <div class="btn-group">
        <button class="btn-start" onclick="startTest()">TESTİ BAŞLAT</button>
        <button class="btn-stop" onclick="stopTest()">DURDUR</button>
      </div>
    </div>
  </div>

  <!-- Live Terminal Logs -->
  <div class="card">
    <div class="card-title">CANLI CANLI KONSOL LOGLARI</div>
    <div class="terminal" id="terminal">
      <div class="log-line">[SİSTEM] Panel hazır. Lütfen hedef sunucu IP girin.</div>
    </div>
  </div>

  <script>
    async function updateStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        
        document.getElementById('botCount').innerText = data.activeBotCount;
        document.getElementById('statusText').innerText = data.running ? 'ÇALIŞIYOR' : 'DURDURULDU';
        document.getElementById('statusText').style.color = data.running ? '#00ff66' : 'var(--primary-red)';

        const term = document.getElementById('terminal');
        if (data.logs && data.logs.length > 0) {
          term.innerHTML = data.logs.map(l => `<div class="log-line">${l}</div>`).join('');
        }
      } catch (e) {}
    }

    async function startTest() {
      const host = document.getElementById('host').value;
      const port = document.getElementById('port').value;
      const botCount = document.getElementById('targetCount').value;

      await fetch('/api/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ host, port, botCount })
      });
    }

    async function stopTest() {
      await fetch('/api/stop', { method: 'POST' });
    }

    setInterval(updateStatus, 1500);
  </script>
</body>
</html>
